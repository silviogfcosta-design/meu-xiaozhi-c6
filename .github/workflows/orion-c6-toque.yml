name: Orion C6 — IA com interface visual

on:
  workflow_dispatch:
  push:
    paths:
      - "orion_ui.cpp"
      - "orion_ui.h"
      - ".github/workflows/orion-c6-toque.yml"

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:release-v6.1

    steps:
      - name: Carregar os arquivos do projeto Orion
        uses: actions/checkout@v4
        with:
          path: orion-project
          ref: main

      - name: Carregar a base Xiaozhi
        uses: actions/checkout@v4
        with:
          repository: 78/xiaozhi-esp32
          ref: a73e9a7e266e3196d1368ba46c30bee0d81f0a64
          clean: false

      - name: Integrar tela, audio, toque e interface Orion
        shell: python3 {0}
        run: |
          from pathlib import Path
          import json
          import shutil

          nl = chr(10)
          board = Path("main/boards/bread-compact-wifi-lcd")
          project = Path("orion-project")
          shutil.copy(project / "orion_ui.cpp", board / "orion_ui.cpp")
          shutil.copy(project / "orion_ui.h", board / "orion_ui.h")

          config = board / "config.h"
          h = config.read_text()
          h = h.replace("#define AUDIO_I2S_METHOD_SIMPLEX" + nl, "")
          pins = {
              "AUDIO_OUTPUT_SAMPLE_RATE": "24000",
              "AUDIO_I2S_GPIO_BCLK": "GPIO_NUM_18",
              "AUDIO_I2S_GPIO_WS": "GPIO_NUM_19",
              "AUDIO_I2S_GPIO_DIN": "GPIO_NUM_20",
              "AUDIO_I2S_GPIO_DOUT": "GPIO_NUM_14",
              "DISPLAY_MOSI_PIN": "GPIO_NUM_7",
              "DISPLAY_CLK_PIN": "GPIO_NUM_6",
              "DISPLAY_DC_PIN": "GPIO_NUM_4",
              "DISPLAY_RST_PIN": "GPIO_NUM_3",
              "DISPLAY_CS_PIN": "GPIO_NUM_5",
              "DISPLAY_BACKLIGHT_PIN": "GPIO_NUM_NC",
              "BOOT_BUTTON_GPIO": "GPIO_NUM_9",
          }
          lines = h.splitlines(keepends=True)
          for key, value in pins.items():
              found = False
              for i, line in enumerate(lines):
                  if line.startswith("#define " + key):
                      lines[i] = "#define " + key + " " + value + nl
                      found = True
                      break
              assert found, key
          h = "".join(lines)

          start = h.index("#ifdef CONFIG_LCD_ST7789_240X320")
          end = h.index("#endif", start)
          panel = h[start:end]
          replacements = {
              "DISPLAY_WIDTH   240": "DISPLAY_WIDTH   320",
              "DISPLAY_HEIGHT  320": "DISPLAY_HEIGHT  240",
              "DISPLAY_SWAP_XY false": "DISPLAY_SWAP_XY true",
              "DISPLAY_MIRROR_X false": "DISPLAY_MIRROR_X true",
          }
          for old, new in replacements.items():
              assert old in panel, old
              panel = panel.replace(old, new, 1)
          config.write_text(h[:start] + panel + h[end:])

          source = board / "compact_wifi_board_lcd.cc"
          s = source.read_text()
          s = s.replace('#include "config.h"', '#include "config.h"' + nl + '#include "orion_ui.h"', 1)
          s = s.replace("SPI3_HOST", "SPI2_HOST")
          s = s.replace("40 * 1000 * 1000", "20 * 1000 * 1000")
          led_start = s.index("    virtual Led* GetLed() override {")
          led_end = s.index("    }", led_start) + len("    }")
          s = s[:led_start] + s[led_end:]
          s = s.replace('#include "lamp_controller.h"' + nl, "")
          s = s.replace("        static LampController lamp(LAMP_GPIO);" + nl, "")
          s = s.replace(
              "    Button boot_button_;",
              "    Button boot_button_;" + nl + "    Button touch_button_{GPIO_NUM_2, true};",
              1,
          )
          touch_block = nl.join([
              "    void InitializeButtons() {",
              "        gpio_set_pull_mode(GPIO_NUM_2, GPIO_PULLDOWN_ONLY);",
              "        touch_button_.OnClick([]() {",
              "            auto& app = Application::GetInstance();",
              "            if (app.GetDeviceState() != kDeviceStateStarting) {",
              "                app.ToggleChatState();",
              "            }",
              "        });",
          ])
          s = s.replace(
              "    void InitializeButtons() {",
              touch_block,
              1,
          )
          s = s.replace("        InitializeLcdDisplay();", "        InitializeLcdDisplay();" + nl + "        ui_orion_start();", 1)
          source.write_text(s)

          cmake = Path("main/CMakeLists.txt")
          c = cmake.read_text()
          marker = 'set(SOURCES "audio/audio_codec.cc"'
          assert marker in c
          c = c.replace(
              marker,
              'set(SOURCES "boards/bread-compact-wifi-lcd/orion_ui.cpp"' + nl + '            "audio/audio_codec.cc"',
              1,
          )
          cmake.write_text(c)

          kconfig = Path("main/Kconfig.projbuild")
          k = kconfig.read_text()
          start = k.index("config BOARD_TYPE_BREAD_COMPACT_WIFI_LCD")
          section = k[start:]
          old = "depends on IDF_TARGET_ESP32S3"
          pos = section.index(old)
          section = section[:pos] + "depends on IDF_TARGET_ESP32C6" + section[pos + len(old):]
          kconfig.write_text(k[:start] + section)

          board_json = board / "config.json"
          settings = json.loads(board_json.read_text())
          settings.update(target="esp32c6", type="orion-c6-lcd")
          build = settings["builds"][0]
          build["name"] = "orion-c6-lcd"
          build["sdkconfig_append"] += [
              "CONFIG_BOARD_TYPE_BREAD_COMPACT_WIFI_LCD=y",
              "CONFIG_ESPTOOLPY_FLASHSIZE_4MB=y",
              'CONFIG_PARTITION_TABLE_CUSTOM_FILENAME="partitions/v2/4m.csv"',
              "CONFIG_COMPILER_OPTIMIZATION_SIZE=y",
          ]
          board_json.write_text(json.dumps(settings, indent=2))

      - name: Compilar Orion em portugues para flash de 4 MB
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          python scripts/build.py bread-compact-wifi-lcd --name orion-c6-lcd --language pt-BR --wake-word disabled

      - name: Publicar firmware pronto para download
        uses: actions/upload-artifact@v4
        with:
          name: Orion-C6-IA-interface
          path: build/merged-binary.bin
          if-no-files-found: error
